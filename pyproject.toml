[project]
name = "cryptobot"
version = "0.1.0"
description = "Backtester for a Pump.fun dip-buying strategy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.1.3",
    "polars==1.17.1",
    "pyarrow==18.1.0",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptobot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
